<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your SoundWave account.">
    <title>Login | SoundWave</title>

    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --primary: #6c4df6;
            --secondary: #a855f7;
            --dark: #17152b;
            --muted: #77758b;
            --border: #e5e2f0;
            --white: #ffffff;
            --danger: #dc2626;
            --success: #15803d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #ddd6fe, transparent 45%),
                linear-gradient(135deg, #f8f7ff, #eee9ff);
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            background: var(--white);
            border: 1px solid rgba(108, 77, 246, 0.12);
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(53, 35, 120, 0.14);
        }

        .brand {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            color: var(--primary);
            font-size: 27px;
            font-weight: 800;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 13px;
            font-size: 24px;
        }

        h1 {
            margin-bottom: 10px;
            text-align: center;
            color: var(--dark);
            font-size: 29px;
        }

        .subtitle {
            margin-bottom: 28px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: var(--dark);
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            color: var(--dark);
            background: #fcfbff;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(108, 77, 246, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 78px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            padding: 6px;
            color: var(--primary);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .login-button {
            width: 100%;
            min-height: 49px;
            margin-top: 5px;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: 0.2s;
        }

        .login-button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(108, 77, 246, 0.25);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #login-message {
            min-height: 22px;
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        /* Social Login Styles */
        .social-login-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0;
            color: var(--muted);
            font-size: 13px;
        }

        .social-login-divider::before,
        .social-login-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .social-login-divider span {
            padding: 0 10px;
        }

        .social-login-container {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: #fcfbff;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            color: var(--dark);
            cursor: pointer;
            transition: 0.2s;
        }

        .social-btn:hover {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(108, 77, 246, 0.08);
            transform: translateY(-1px);
        }

        .social-icon {
            width: 18px;
            height: 18px;
        }

        .register-link {
            margin-top: 24px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">
        <div class="brand">
            <span class="brand-icon">♫</span>
            <span>SoundWave</span>
        </div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Sign in to your account and enjoy your music.
        </p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="username"
                    maxlength="255"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="toggle-password"
                        aria-label="Show password"
                    >Show</button>
                </div>
            </div>

            <button
                type="submit"
                class="login-button"
                id="login-button"
            >Login</button>

            <p id="login-message" role="status" aria-live="polite"></p>
        </form>

        <!-- Social Login Options -->
        <div class="social-login-divider">
            <span>or continue with</span>
        </div>

        <div class="social-login-container">
            <button type="button" class="social-btn google-btn" onclick="handleSocialLogin('Google')">
                <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.22 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.5-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.13 0 9.83 0 12s.43 3.87 1.18 5.38l4.09-3.14z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
                </svg>
                Google
            </button>

            <button type="button" class="social-btn facebook-btn" onclick="handleSocialLogin('Facebook')">
                <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20" fill="#1877F2">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                Facebook
            </button>
        </div>

        <p class="register-link">
            Don't have an account?
            <a href="/registration.html">Create Account</a>
        </p>

        <a href="/index.html" class="back-link">
            &larr; Back to SoundWave Home
        </a>
    </main>

    <script>
        "use strict";

        const loginForm = document.getElementById("login-form");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("login-button");
        const loginMessage = document.getElementById("login-message");
        const togglePassword = document.getElementById("toggle-password");

        function showMessage(message, type = "error") {
            loginMessage.textContent = message;

            if (type === "success") {
                loginMessage.style.color = "#15803d";
            } else if (type === "info") {
                loginMessage.style.color = "#6c4df6";
            } else {
                loginMessage.style.color = "#dc2626";
            }
        }

        // Show or hide the password.
        togglePassword.addEventListener("click", function () {
            const showPassword = passwordInput.type === "password";

            passwordInput.type = showPassword ? "text" : "password";
            togglePassword.textContent = showPassword ? "Hide" : "Show";
            togglePassword.setAttribute(
                "aria-label",
                showPassword ? "Hide password" : "Show password"
            );
        });

        // Handle Social Logins (Google / Facebook) with Email prompt selection
        function handleSocialLogin(provider) {
            if (provider === 'Google') {
                // Iyi pop-up ya prompt iragusaba guhitamo cyangwa kwandika email yawe (nko mu gihe ufite ebyiri cyangwa zirenzeho)
                const selectedEmail = prompt("Google Sign-In:\nPlease select or enter the email address you want to use:", "user@gmail.com");
                
                if (selectedEmail && selectedEmail.trim() !== "") {
                    showMessage(`Signed in as ${selectedEmail}. Opening SoundWave...`, "success");
                    setTimeout(() => {
                        window.location.replace("dashboard.html");
                    }, 1200);
                } else {
                    showMessage("Google sign-in was cancelled.", "error");
                }
            } else {
                showMessage(`Connecting with ${provider}... Please wait.`, "info");
                setTimeout(() => {
                    window.location.replace("dashboard.html");
                }, 1200);
            }
        }

        // Submit the login form.
        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            if (loginButton.disabled) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage("Please enter your email and password.");
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";
            showMessage("Checking your account...", "info");

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({ email, password })
                });

                const responseText = await response.text();
                let result;

                try {
                    result = responseText ? JSON.parse(responseText) : {};
                } catch {
                    throw new Error(
                        "The server returned an invalid response. Check the backend."
                    );
                }

                if (!response.ok || result.success !== true) {
                    showMessage(
                        result.message ||
                        `Login failed (HTTP ${response.status}).`
                    );
                    return;
                }

                showMessage("Login successful! Opening SoundWave...", "success");

                const destination = "dashboard.html";
                window.location.replace(destination);

            } catch (error) {
                console.error("SoundWave login error:", error);

                showMessage(
                    error.message ||
                    "Could not connect to the server. Make sure it is running at localhost:3000."
                );
            } finally {
                if (document.visibilityState === "visible") {
                    loginButton.disabled = false;
                    loginButton.textContent = "Login";
                }
            }
        });
    </script>
</body>
</html>
